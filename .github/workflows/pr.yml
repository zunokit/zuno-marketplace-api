name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  GO_VERSION: '1.21'

jobs:
  pr-check:
    name: PR Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
          scopes: |
            auth
            user
            wallet
            gateway
            database
            infra
            ci
            docs

      - name: Check commit messages
        run: |
          git log --format=%B origin/${{ github.base_ref }}..${{ github.sha }} | \
          while read line; do
            if [[ ! "$line" =~ ^(feat|fix|docs|style|refactor|perf|test|chore|ci)(\(.+\))?: .+ ]]; then
              echo "Invalid commit message format: $line"
              echo "Expected: <type>(<scope>): <description>"
              exit 1
            fi
          done

      - name: Check for conflicts
        run: |
          git merge-base --is-ancestor origin/${{ github.base_ref }} HEAD || \
          (echo "Branch is not up to date with base" && exit 1)

  code-review:
    name: Automated Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted. Run 'make format'"
            gofmt -l .
            exit 1
          fi

      - name: Check for TODO/FIXME
        run: |
          todos=$(grep -r "TODO\|FIXME" --include="*.go" . || true)
          if [ -n "$todos" ]; then
            echo "Found TODO/FIXME comments:"
            echo "$todos"
            echo "Please create issues for these before merging"
          fi

  size-check:
    name: PR Size Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          files_changed=$(git diff --name-only origin/${{ github.base_ref }}..HEAD | wc -l)
          lines_changed=$(git diff --stat origin/${{ github.base_ref }}..HEAD | tail -1 | awk '{print $4+$6}')

          echo "Files changed: $files_changed"
          echo "Lines changed: $lines_changed"

          if [ $files_changed -gt 50 ]; then
            echo "::warning::PR changes $files_changed files. Consider splitting into smaller PRs."
          fi

          if [ $lines_changed -gt 1000 ]; then
            echo "::warning::PR changes $lines_changed lines. Consider splitting into smaller PRs."
          fi

  test-coverage:
    name: Test Coverage Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nft_marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests with coverage
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DATABASE: nft_marketplace_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check coverage threshold
        run: |
          coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${coverage}%"

          if (( $(echo "$coverage < 80" | bc -l) )); then
            echo "::warning::Coverage is ${coverage}%, below 80% threshold"
          fi

      - name: Comment coverage on PR
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          fail_ci_if_error: false
