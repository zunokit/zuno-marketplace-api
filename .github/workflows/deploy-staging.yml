name: Deploy to Staging

on:
  push:
    branches: [main, develop-claude, feature/add-sentry]
  workflow_dispatch:

env:
  GO_VERSION: '1.21'
  SENTRY_ORG: zuno
  SENTRY_PROJECT: zuno-marketplace-api

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for Sentry releases

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DATABASE: nft_marketplace_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
          RABBITMQ_USER: guest
          RABBITMQ_PASSWORD: guest
        run: go test -v ./...

      - name: Build services
        run: make build

      - name: Create Sentry Release
        if: secrets.SENTRY_AUTH_TOKEN != ''
        run: |
          # Install Sentry CLI
          npm install -g @sentry/cli

          # Get version from git
          VERSION=$(git describe --tags --always --dirty)

          # Create Sentry release with commits
          sentry-cli releases new "$VERSION" \
            --org ${{ env.SENTRY_ORG }} \
            --project ${{ env.SENTRY_PROJECT }}
          sentry-cli releases set-commits "$VERSION" --auto
          sentry-cli releases finalize "$VERSION"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Created Sentry release: $VERSION"
        id: sentry-release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ env.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ env.SENTRY_PROJECT }}

      - name: Deploy to Staging
        run: |
          # Build Docker images for staging
          docker compose -f docker-compose.staging.yml build

          # Deploy to staging environment
          docker compose -f docker-compose.staging.yml up -d

          echo "Deployed to staging"
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop-claude'

      - name: Notify Sentry of Deploy
        if: success() && secrets.SENTRY_AUTH_TOKEN != '' && steps.sentry-release.outputs.version != ''
        run: |
          # Install Sentry CLI (already installed above)
          VERSION="${{ steps.sentry-release.outputs.version }}"

          # Create deploy in Sentry
          sentry-cli releases deploys "$VERSION" new \
            --org ${{ env.SENTRY_ORG }} \
            --project ${{ env.SENTRY_PROJECT }} \
            --env staging \
            --name "Staging Deploy" \
            --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "Notified Sentry of deploy: $VERSION"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ env.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ env.SENTRY_PROJECT }}

      - name: Deploy Health Check
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop-claude')
        run: |
          # Wait for services to be ready
          sleep 30

          # Check health endpoint (adjust URL as needed)
          curl -f http://localhost:8080/health || exit 1
          curl -f http://localhost:8081/health || exit 1
          echo "Health check passed"

      - name: Notify on Failure
        if: failure()
        run: |
          VERSION="${{ steps.sentry-release.outputs.version }}"

          # Send notification about failed deploy
          echo "Deploy failed for version: $VERSION"
          echo "Workflow URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Optional: Send to Slack or other notification service
          # curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
          #   -H 'Content-Type: application/json' \
          #   -d "{\"text\": \"Deployment failed: $VERSION\"}"
