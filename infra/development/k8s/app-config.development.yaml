apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: dev
data:
  # Application Environment
  ENVIRONMENT: "development"
  INFRA_MODE: "serverless"

  # ===================================
  # Serverless Mode - Cloud Infrastructure
  # ===================================
  # NOTE: Full URLs with credentials loaded from k8s secrets
  # Services check for URL first (DATABASE_URL, REDIS_URL, CLOUDAMQP_URL)
  # If not set, they fall back to individual config parts

  # Database Configuration - Supabase (Cloud)
  # Individual config parts (for reference, actual connection uses DATABASE_URL from secrets)
  POSTGRES_HOST: "db.xqsujkyuargadsnrikme.supabase.co"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "postgres"
  POSTGRES_DATABASE: "postgres"
  POSTGRES_SSL_MODE: "require"

  # Redis Configuration - Upstash (Cloud)
  # Individual config parts (for reference, actual connection uses REDIS_URL from secrets)
  REDIS_HOST: "tender-stag-16168.upstash.io"
  REDIS_PORT: "6379"

  # RabbitMQ Configuration - CloudAMQP (Cloud)
  # Individual config (actual connection uses CLOUDAMQP_URL from secrets)
  RABBITMQ_EXCHANGE: "nft-marketplace"

  # ===================================
  # Service Ports (gRPC)
  # ===================================
  AUTH_GRPC_PORT: "50051"
  USER_GRPC_PORT: "50052"
  WALLET_GRPC_PORT: "50053"
  ORCHESTRATOR_GRPC_PORT: "50054"
  MEDIA_GRPC_PORT: "50055"
  CHAIN_REGISTRY_GRPC_PORT: "50056"
  CATALOG_GRPC_PORT: "50057"
  INDEXER_GRPC_PORT: "50058"

  # GraphQL Gateway
  GATEWAY_HTTP_ADDR: "8081"

  # Monitoring
  SENTRY_ENVIRONMENT: "development"
