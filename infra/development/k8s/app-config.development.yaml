apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: dev
data:
  # Application Environment
  ENVIRONMENT: "development"
  INFRA_MODE: "serverless"

  # ===================================
  # Serverless Mode - Cloud Infrastructure
  # ===================================
  # All connection URLs (with credentials) loaded from k8s secrets
  # Services check DATABASE_URL, REDIS_URL, CLOUDAMQP_URL first

  # RabbitMQ exchange name (non-sensitive)
  RABBITMQ_EXCHANGE: "nft-marketplace"

  # ===================================
  # Service Ports (gRPC)
  # ===================================
  AUTH_GRPC_PORT: "50051"
  USER_GRPC_PORT: "50052"
  WALLET_GRPC_PORT: "50053"
  ORCHESTRATOR_GRPC_PORT: "50054"
  MEDIA_GRPC_PORT: "50055"
  CHAIN_REGISTRY_GRPC_PORT: "50056"
  CATALOG_GRPC_PORT: "50057"
  INDEXER_GRPC_PORT: "50058"

  # GraphQL Gateway
  GATEWAY_HTTP_ADDR: "8081"

  # Monitoring
  SENTRY_ENVIRONMENT: "development"
