apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: dev
data:
  # Application Environment
  ENVIRONMENT: "development"
  INFRA_MODE: "serverless"

  # Database Configuration - Supabase (Cloud)
  # Secrets (POSTGRES_PASSWORD, SUPABASE_KEYS) loaded from k8s secrets
  POSTGRES_HOST: "db.xqsujkyuargadsnrikme.supabase.co"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "postgres"
  POSTGRES_DATABASE: "postgres"

  # Redis Configuration - Upstash (Cloud)
  # Secrets (UPSTASH_REDIS_REST_TOKEN) loaded from k8s secrets
  REDIS_HOST: "tender-stag-16168.upstash.io"
  REDIS_PORT: "6379"
  UPSTASH_REDIS_REST_URL: "https://tender-stag-16168.upstash.io"

  # RabbitMQ Configuration - CloudAMQP (Cloud)
  # Secrets (RABBITMQ_URL, CLOUDAMQP_URL) loaded from k8s secrets
  RABBITMQ_EXCHANGE: "nft-marketplace"

  # Service Ports (gRPC)
  AUTH_GRPC_PORT: "50051"
  USER_GRPC_PORT: "50052"
  WALLET_GRPC_PORT: "50053"
  ORCHESTRATOR_GRPC_PORT: "50054"
  MEDIA_GRPC_PORT: "50055"
  CHAIN_REGISTRY_GRPC_PORT: "50056"
  CATALOG_GRPC_PORT: "50057"
  INDEXER_GRPC_PORT: "50058"

  # GraphQL Gateway
  GATEWAY_HTTP_ADDR: "8081"

  # Monitoring
  SENTRY_ENVIRONMENT: "development"
