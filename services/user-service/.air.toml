root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -ldflags=\"-s -w\" -o ./tmp/main.exe ./cmd/"
bin = "tmp/main.exe"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["tmp", "vendor", "build", "logs"]
include_dir = ["cmd", "internal", "pkg", "../../shared/env", "../../shared/observability", "../../shared/proto"]
exclude_file = []
exclude_unchanged = false
follow_symlink = false
delay = 1000
stop_on_root = false
rerun = false
rerun_delay = 500

[log]
time = true
main_only = false

[color]
main = "magenta"
builder = "yellow"
runner = "green"

[misc]
clean_on_exit = false
