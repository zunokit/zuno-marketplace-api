services:
  # Infrastructure Services
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01-init-schema.sql
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "15672:15672"
    networks:
      - app-network

  # Application Services
  auth-service:
    build:
      context: .
      dockerfile: infra/development/docker/auth-service.Dockerfile
      args:
        - CGO_ENABLED=0
        - GOOS=linux
        - GOARCH=amd64
    container_name: auth-service
    env_file:
      - .env
    environment:
      - AUTH_GRPC_PORT=:${AUTH_GRPC_PORT}
      - USER_SERVICE_URL=user-service:${USER_GRPC_PORT}
      - WALLET_SERVICE_URL=wallet-service:${WALLET_GRPC_PORT}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE}
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
    ports:
      - "${AUTH_GRPC_PORT}:${AUTH_GRPC_PORT}"
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - user-service
      - wallet-service
    networks:
      - app-network

  user-service:
    build:
      context: .
      dockerfile: infra/development/docker/user-service.Dockerfile
      args:
        - CGO_ENABLED=0
        - GOOS=linux
        - GOARCH=amd64
    container_name: user-service
    env_file:
      - .env
    environment:
      - USER_GRPC_PORT=:${USER_GRPC_PORT}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
    ports:
      - "${USER_GRPC_PORT}:${USER_GRPC_PORT}"
    depends_on:
      - postgres
    networks:
      - app-network

  wallet-service:
    build:
      context: .
      dockerfile: infra/development/docker/wallet-service.Dockerfile
      args:
        - CGO_ENABLED=0
        - GOOS=linux
        - GOARCH=amd64
    container_name: wallet-service
    env_file:
      - .env
    environment:
      - WALLET_GRPC_PORT=:${WALLET_GRPC_PORT}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
    ports:
      - "${WALLET_GRPC_PORT}:${WALLET_GRPC_PORT}"
    depends_on:
      - postgres
    networks:
      - app-network

  graphql-gateway:
    build:
      context: .
      dockerfile: infra/development/docker/graphql-gateway.Dockerfile
    container_name: graphql-gateway
    environment:
      - GATEWAY_HTTP_ADDR=:${GATEWAY_HTTP_ADDR}
      - AUTH_SERVICE_URL=auth-service:${AUTH_GRPC_PORT}
      - USER_SERVICE_URL=user-service:${USER_GRPC_PORT}
      - WALLET_SERVICE_URL=wallet-service:${WALLET_GRPC_PORT}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE}
    ports:
      - "${GATEWAY_HTTP_ADDR}:${GATEWAY_HTTP_ADDR}"
    depends_on:
      - auth-service
      - user-service
      - wallet-service
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
