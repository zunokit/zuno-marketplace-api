services:
  # Infrastructure Services
  postgres:
    image: postgres:15-alpine
    container_name: nft-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/auth-service/db/up.sql:/docker-entrypoint-initdb.d/01-auth-schema.sql
      - ./services/user-service/db/up.sql:/docker-entrypoint-initdb.d/02-user-schema.sql
      - ./services/wallet-service/db/up.sql:/docker-entrypoint-initdb.d/03-wallet-schema.sql
    networks:
      - nft-network

  redis:
    image: redis:7-alpine
    container_name: nft-redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - nft-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nft-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "15672:15672"
    networks:
      - nft-network

  # Application Services
  auth-service:
    build:
      context: .
      dockerfile: infra/development/docker/auth-service.Dockerfile
      args:
        - CGO_ENABLED=0
        - GOOS=linux
        - GOARCH=amd64
    container_name: nft-auth-service
    env_file:
      - .env
    environment:
      - AUTH_GRPC_PORT=:${AUTH_GRPC_PORT}
      - USER_SERVICE_URL=user-service:${USER_GRPC_PORT}
      - WALLET_SERVICE_URL=wallet-service:${WALLET_GRPC_PORT}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE}
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
    ports:
      - "${AUTH_GRPC_PORT}:${AUTH_GRPC_PORT}"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - nft-network
    develop:
      watch:
        - path: ./shared
          target: /app/shared
          action: sync
        - path: ./services/auth-service
          target: /app/services/auth-service
          action: sync
        - path: ./go.mod
          target: /app/go.mod
          action: sync
        - path: ./go.sum
          target: /app/go.sum
          action: sync
        - path: .
          action: rebuild

  user-service:
    build:
      context: .
      dockerfile: infra/development/docker/user-service.Dockerfile
    container_name: nft-user-service
    environment:
      - USER_GRPC_PORT=:${USER_GRPC_PORT}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE}
    ports:
      - "${USER_GRPC_PORT}:${USER_GRPC_PORT}"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - nft-network
    develop:
      watch:
        - path: ./shared
          target: /app/shared
          action: sync
        - path: ./services/user-service
          target: /app/services/user-service
          action: sync
        - path: ./go.mod
          target: /app/go.mod
          action: sync
        - path: ./go.sum
          target: /app/go.sum
          action: sync
        - path: .
          action: rebuild

  wallet-service:
    build:
      context: .
      dockerfile: infra/development/docker/wallet-service.Dockerfile
    container_name: nft-wallet-service
    environment:
      - WALLET_GRPC_PORT=:${WALLET_GRPC_PORT}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE}
    ports:
      - "${WALLET_GRPC_PORT}:${WALLET_GRPC_PORT}"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - nft-network
    develop:
      watch:
        - path: ./shared
          target: /app/shared
          action: sync
        - path: ./services/wallet-service
          target: /app/services/wallet-service
          action: sync
        - path: ./go.mod
          target: /app/go.mod
          action: sync
        - path: ./go.sum
          target: /app/go.sum
          action: sync
        - path: .
          action: rebuild

  graphql-gateway:
    build:
      context: .
      dockerfile: infra/development/docker/graph-gateway.Dockerfile
    container_name: nft-graphql-gateway
    environment:
      - GATEWAY_HTTP_ADDR=:${GATEWAY_HTTP_ADDR}
      - AUTH_SERVICE_URL=auth-service:${AUTH_GRPC_PORT}
      - USER_SERVICE_URL=user-service:${USER_GRPC_PORT}
      - WALLET_SERVICE_URL=wallet-service:${WALLET_GRPC_PORT}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE}
    ports:
      - "${GATEWAY_HTTP_ADDR}:${GATEWAY_HTTP_ADDR}"
    depends_on:
      - auth-service
      - user-service
      - wallet-service
    networks:
      - nft-network
    develop:
      watch:
        - path: ./shared
          target: /app/shared
          action: sync
        - path: ./services/graphql-gateway
          target: /app/services/graphql-gateway
          action: sync
        - path: ./go.mod
          target: /app/go.mod
          action: sync
        - path: ./go.sum
          target: /app/go.sum
          action: sync
        - path: .
          action: rebuild

volumes:
  postgres_data:

networks:
  nft-network:
    driver: bridge
